<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="opGlow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1A120B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241408"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#opGlow)"/>
  <rect x="60" y="60" width="1080" height="630" rx="20" fill="url(#cardGrad1)" stroke="rgba(255,106,0,0.3)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="8" fill="#EF4444"/>
  <circle cx="125" cy="100" r="8" fill="#F59E0B"/>
  <circle cx="150" cy="100" r="8" fill="#10B981"/>
  <rect x="200" y="90" width="400" height="20" rx="10" fill="rgba(255,255,255,0.06)"/>
  
  <!-- Content Mockup -->
  <text x="120" y="240" fill="#FF6A00" font-family="monospace" font-size="20" font-weight="bold">OPERON // SYSTEM ENGINE</text>
  <text x="120" y="300" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="700">Autonomous Microservices Orchestration</text>
  <text x="120" y="350" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="20">Distributed workflow automation with real-time telemetric monitoring</text>
  
  <!-- Mini dashboard cards -->
  <g transform="translate(120, 420)">
    <rect width="280" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="44" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">SYSTEM LATENCY</text>
    <text x="24" y="90" fill="#FFFFFF" font-family="monospace" font-size="32" font-weight="bold">1.2ms</text>
    <path d="M 24 140 Q 80 110 140 130 T 250 110" stroke="#FF6A00" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(430, 420)">
    <rect width="280" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="44" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">EVENT THROUGHPUT</text>
    <text x="24" y="90" fill="#FFFFFF" font-family="monospace" font-size="32" font-weight="bold">94.8k/s</text>
    <path d="M 24 140 Q 80 135 140 115 T 250 95" stroke="#3B82F6" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(740, 420)">
    <rect width="340" height="180" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="44" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">ACTIVE WORKERS</text>
    <text x="24" y="90" fill="#22C55E" font-family="monospace" font-size="32" font-weight="bold">128 Nodes</text>
    <rect x="24" y="125" width="290" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="24" y="125" width="240" height="8" rx="4" fill="#22C55E"/>
  </g>
</svg>
